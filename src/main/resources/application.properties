spring.application.name=largecom
server.port=8070

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enable=true
spring.flyway.clean-disabled=true
spring.flyway.location=closepath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-version=0


# --- Connection comes from env vars never committed --
spring.datasource.url=jdbc:postgresql://localhost:5436/punta
spring.datasource.username=postgres
spring.datasource.password=password
spring.docker.compose.lifecycle-management=start-only
#so Spring never runs down.
# 256-bit secret key for HMAC-SHA256 (minimum 32 characters)
security.jwt.secret-key=your-super-secret-key-that-is-at-least-32-characters-long!
security.jwt.access-token-expiration-seconds=900

